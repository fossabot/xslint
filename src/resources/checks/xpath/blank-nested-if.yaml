---
xpath: //xsl:if[(count(*) = 1) and (count(xsl:if) = 1) and not(text()[xslint:normalize-space(.) or ancestor::*[@xml:space][1]/@xml:space = 'preserve'])]
severity: warning
message: "An xsl:if holds nothing but another xsl:if, stating one condition in two places. Combine the tests with 'and' in one xsl:if, unless the outer test guards the inner one."
