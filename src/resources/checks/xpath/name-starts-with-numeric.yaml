---
xpath: "//(xsl:variable | xsl:param | xsl:template | xsl:function)[matches(@name, '^([^:]*:)?[0-9]')]"
severity: error
message: A variable, parameter, function, or template name starting with a digit is no QName, so no processor will load this stylesheet
