---
xpath: "//(xsl:variable | xsl:param | xsl:template | xsl:function)[string-length(substring-after(xslint:attribute(., 'name'), ':')) = 1 or (string-length(xslint:attribute(., 'name')) = 1 and not(contains(xslint:attribute(., 'name'), ':')))]"
severity: warning
preset: all
message: A variable, parameter, function, or template has a single-character name. Use a descriptive name that reveals intent.
