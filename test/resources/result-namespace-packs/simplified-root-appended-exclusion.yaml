  fixes: [ "ex xs" ]
input: |-
  <?xml version="1.0"?>
  <page xmlns:x="http://www.w3.org/1999/XSL/Transform" xmlns:ex="urn:ex" xmlns:xs="http://www.w3.org/2001/XMLSchema" x:exclude-result-prefixes="ex" exclude-result-prefixes="xs" x:version="2.0">
    <x:value-of select="ex:sum(/rows/r) cast as xs:decimal"/>
  </page>
