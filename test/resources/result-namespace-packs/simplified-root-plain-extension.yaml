pack: leaking-result-namespace
# On a simplified root the unprefixed extension-element-prefixes is a result
# attribute, so it designates no extension namespace and the prefix leaks
# (#1086).
found:
  amount: 1
  positions: [ [ 2, 56 ] ]
  fixes: [ " xsl:exclude-result-prefixes=\"my\"" ]
input: |-
  <?xml version="1.0"?>
  <html xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:my="urn:my" extension-element-prefixes="my" xsl:version="1.0">
    <body>
      <xsl:value-of select="count(//my:node)"/>
    </body>
  </html>
