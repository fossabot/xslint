---
pack: leaking-result-namespace
# The XSLT namespace is never copied into a result tree, so the prefix bound
# to it does not leak, whatever it is spelled and whether or not a namespaced
# attribute of the root names it (#1075).
found:
  amount: 1
  positions: [ [ 2, 54 ] ]
  fixes: [ " tt:exclude-result-prefixes=\"xs\"" ]
input: |-
  <?xml version="1.0"?>
  <out xmlns:tt="http://www.w3.org/1999/XSL/Transform" xmlns:xs="http://www.w3.org/2001/XMLSchema">
    <tt:value-of select="7 cast as xs:integer"/>
    <tt:value-of select="tt:foo"/>
  </out>
