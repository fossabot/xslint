---
# What yields nodes is a closed set of shapes, so a variable bound to one of
# them keeps the fix: a step, a path ending in one or standing alone as the
# root, a variable, a union or an intersection, a filter, a mapping onto a
# step, and the few standard calls answering nodes (#1043).
pack: confusing-variable-and-node
found:
  amount: 9
  positions: [ [ 14, 26 ], [ 15, 26 ], [ 16, 26 ], [ 17, 26 ], [ 18, 26 ], [ 19, 26 ], [ 20, 26 ], [ 21, 26 ], [ 22, 26 ] ]
  fixes: [ "$top", "$alias", "$both", "$first", "$mapped", "$keyed", "$rest", "$fetched", "$parent" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0" id="s">
    <xsl:key name="by" match="part" use="@id"/>
    <xsl:template match="othercredit">
      <xsl:variable name="top" select="/"/>
      <xsl:variable name="alias" select="$top"/>
      <xsl:variable name="both" select="title | $alias/part"/>
      <xsl:variable name="first" select="(part)[1]"/>
      <xsl:variable name="mapped" select="part ! title"/>
      <xsl:variable name="keyed" select="key('by', @ref)"/>
      <xsl:variable name="rest" select="part except title"/>
      <xsl:variable name="fetched" select="doc('other.xml')"/>
      <xsl:variable name="parent" select=".."/>
      <xsl:copy-of select="top"/>
      <xsl:copy-of select="alias"/>
      <xsl:copy-of select="both"/>
      <xsl:copy-of select="first"/>
      <xsl:copy-of select="mapped"/>
      <xsl:copy-of select="keyed"/>
      <xsl:copy-of select="rest"/>
      <xsl:copy-of select="fetched"/>
      <xsl:copy-of select="parent"/>
    </xsl:template>
  </xsl:stylesheet>
