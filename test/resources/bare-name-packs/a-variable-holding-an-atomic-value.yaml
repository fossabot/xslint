# A variable bound to a string, a number or any atomic type holds no node, so
# spelling it where a node is selected is a type error rather than the node
# meant, and only the report stands (#1001). Which calls answer an atomic value
# is an open list, so a call nobody names answers one too, and so does an
# arithmetic, a comparison, a path ending in one and an empty pair (#1043).
