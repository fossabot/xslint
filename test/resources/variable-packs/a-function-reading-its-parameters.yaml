input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:my="urn:my" version="3.0">
    <xsl:function name="my:twice">
      <xsl:param name="arg"/>
      <xsl:iterate select="1 to 2">
        <xsl:param name="sum" select="$arg"/>
        <xsl:on-completion select="$sum"/>
        <xsl:next-iteration>
          <xsl:with-param name="sum" select="$sum + $arg"/>
        </xsl:next-iteration>
      </xsl:iterate>
    </xsl:function>
    <xsl:template match="/">
      <xsl:value-of select="my:twice(1)"/>
    </xsl:template>
  </xsl:stylesheet>
