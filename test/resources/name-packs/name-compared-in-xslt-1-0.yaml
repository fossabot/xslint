# A prefixed `name()` reports and rewrites at 1.0, the prefix naming the
# namespace a node test asks for. An unprefixed `name()` reports with no
# rewrite: it answers the bare name of an element in a default namespace too,
# which only the `*:name` wildcard spells, and 1.0 has none. A `local-name()`
# draws nothing, being the one call that is not prefix-fragile (#962, #1000,
# #1042).
pack: name-compared-to-string
